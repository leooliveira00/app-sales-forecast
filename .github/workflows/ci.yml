name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # mesma major das imagens Docker (node:20-alpine)
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Os enums do Prisma (ex.: SubmissionStatus) são usados nos schemas zod e nos testes.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  dags:
    name: DAGs (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # padrão da imagem apache/airflow:2.10.3
          cache: pip
          cache-dependency-path: dags/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
